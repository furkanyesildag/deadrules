name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.17', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # The end-to-end tests build throwaway git repos and worktrees, so
          # they need a real git identity and more than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com
      - run: git config --global user.name CI
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
