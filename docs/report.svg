<svg xmlns="http://www.w3.org/2000/svg" width="719" height="986" viewBox="0 0 719 986" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
  <rect width="100%" height="100%" rx="10" fill="#15171c"/>
  <rect width="100%" height="34" rx="10" fill="#20232b"/>
  <rect y="24" width="100%" height="10" fill="#20232b"/>
  <circle cx="20" cy="17" r="5" fill="#f2777a"/>
  <circle cx="38" cy="17" r="5" fill="#e0af68"/>
  <circle cx="56" cy="17" r="5" fill="#9ece6a"/>
  <text x="76" y="21" fill="#6f7a8d" font-size="12">$ deadrules ablate</text>
  <g>
    <text x="35.6" y="72" fill="#f2f5fa" font-weight="600" xml:space="preserve">deadrules</text>
    <text x="35.6" y="112" fill="#6f7a8d" xml:space="preserve">rules</text><text x="74.6" y="112" fill="#d6dbe5" xml:space="preserve">    CLAUDE.md </text><text x="183.8" y="112" fill="#6f7a8d" xml:space="preserve">· 39 rules</text>
    <text x="35.6" y="132" fill="#6f7a8d" xml:space="preserve">tasks</text><text x="74.6" y="132" fill="#d6dbe5" xml:space="preserve">    12</text>
    <text x="35.6" y="152" fill="#6f7a8d" xml:space="preserve">agent</text><text x="74.6" y="152" fill="#d6dbe5" xml:space="preserve">    claude (haiku-4.5) </text><text x="254.0" y="152" fill="#6f7a8d" xml:space="preserve">· 3 trials per variant</text>
    <text x="35.6" y="172" fill="#6f7a8d" xml:space="preserve">spent</text><text x="74.6" y="172" fill="#d6dbe5" xml:space="preserve">    288 runs </text><text x="176.0" y="172" fill="#6f7a8d" xml:space="preserve">· $6.42</text>
    <text x="35.6" y="212" fill="#f2f5fa" font-weight="600" xml:space="preserve">DOES THE FILE MATTER?</text>
    <text x="20.0" y="232" fill="#d6dbe5" xml:space="preserve">  all rules   ##############......   72%</text><text x="332.0" y="232" fill="#6f7a8d" xml:space="preserve"> (26/36)</text><text x="394.4" y="232" fill="#6f7a8d" xml:space="preserve">  95% CI 56%-84%</text>
    <text x="20.0" y="252" fill="#d6dbe5" xml:space="preserve">  no rules    ##########..........   50%</text><text x="332.0" y="252" fill="#6f7a8d" xml:space="preserve"> (18/36)</text><text x="394.4" y="252" fill="#6f7a8d" xml:space="preserve">  95% CI 34%-66%</text>
    <text x="129.2" y="272" fill="#6f7a8d" xml:space="preserve">p=0.090</text><text x="199.4" y="272" fill="#e0af68" xml:space="preserve">no measurable difference with or without the file</text>
    <text x="35.6" y="312" fill="#f2f5fa" font-weight="600" xml:space="preserve">LOAD-BEARING</text><text x="144.8" y="312" fill="#6f7a8d" xml:space="preserve">removing this rule made the agent worse</text>
    <text x="20.0" y="332" fill="#6f7a8d" xml:space="preserve">    id    removed</text>
    <text x="51.2" y="352" fill="#9ece6a" xml:space="preserve">R07</text><text x="74.6" y="352" fill="#d6dbe5" xml:space="preserve">   -39pp</text><text x="137.0" y="352" fill="#6f7a8d" xml:space="preserve">  q=0.004   </text><text x="230.6" y="352" fill="#d6dbe5" xml:space="preserve">  Always add a test alongside a behaviour change.</text>
    <text x="51.2" y="372" fill="#9ece6a" xml:space="preserve">R22</text><text x="74.6" y="372" fill="#d6dbe5" xml:space="preserve">   -28pp</text><text x="137.0" y="372" fill="#6f7a8d" xml:space="preserve">  q=0.031   </text><text x="230.6" y="372" fill="#d6dbe5" xml:space="preserve">  Never edit files under `generated/` — they come from the …</text>
    <text x="35.6" y="412" fill="#f2f5fa" font-weight="600" xml:space="preserve">HARMFUL</text><text x="144.8" y="412" fill="#6f7a8d" xml:space="preserve">removing this rule made the agent better</text>
    <text x="20.0" y="432" fill="#6f7a8d" xml:space="preserve">    id    removed</text>
    <text x="51.2" y="452" fill="#f2777a" xml:space="preserve">R31</text><text x="74.6" y="452" fill="#d6dbe5" xml:space="preserve">   +22pp</text><text x="137.0" y="452" fill="#6f7a8d" xml:space="preserve">  q=0.022   </text><text x="230.6" y="452" fill="#d6dbe5" xml:space="preserve">  Think step by step before writing any code.</text>
    <text x="35.6" y="492" fill="#f2f5fa" font-weight="600" xml:space="preserve">NO EVIDENCE</text><text x="144.8" y="492" fill="#6f7a8d" xml:space="preserve">8 rules changed nothing that was measured</text>
    <text x="51.2" y="512" fill="#6f7a8d" xml:space="preserve">R01 R02 R03 R04 R05 R11 R12 R13</text>
    <text x="20.0" y="532" fill="#6f7a8d" xml:space="preserve">    0 tested alone, 8 in groups</text>
    <text x="20.0" y="552" fill="#6f7a8d" xml:space="preserve">    --all to list them</text>
    <text x="35.6" y="592" fill="#f2f5fa" font-weight="600" xml:space="preserve">GROUP MATTERS</text><text x="144.8" y="592" fill="#6f7a8d" xml:space="preserve">something in here changed the outcome, but which is unresolved</text>
    <text x="51.2" y="612" fill="#6f7a8d" xml:space="preserve">1 of 3:</text><text x="113.6" y="612" fill="#e0af68" xml:space="preserve">R18 R19 R20</text>
    <text x="20.0" y="632" fill="#6f7a8d" xml:space="preserve">      removing all of them: -25pp  p=0.054</text>
    <text x="20.0" y="652" fill="#6f7a8d" xml:space="preserve">    raise --budget-runs to find out which</text>
    <text x="35.6" y="692" fill="#f2f5fa" font-weight="600" xml:space="preserve">UNTESTED</text><text x="144.8" y="692" fill="#6f7a8d" xml:space="preserve">2 rules · budget ran out</text>
    <text x="51.2" y="712" fill="#6f7a8d" xml:space="preserve">R38 R39</text>
    <text x="35.6" y="752" fill="#6f7a8d" xml:space="preserve">────────────────────────────────────────────────────────────────────────────</text>
    <text x="20.0" y="772" fill="#d6dbe5" xml:space="preserve">  2 load-bearing · 1 harmful · 8 no evidence · 3 in groups that matter · 2 untested</text>
    <text x="20.0" y="792" fill="#7dcfff" xml:space="preserve">  "No evidence" is not "no effect": on 72 baseline trials against</text>
    <text x="20.0" y="812" fill="#7dcfff" xml:space="preserve">  36 per variant, this run could only detect a swing of about</text>
    <text x="20.0" y="832" fill="#7dcfff" xml:space="preserve">  29pp. More tasks, or more trials, shrink that.</text>
    <text x="20.0" y="852" fill="#6f7a8d" xml:space="preserve">  Pass rates are compared task by task and combined, so a hard task is</text>
    <text x="20.0" y="872" fill="#6f7a8d" xml:space="preserve">  not mistaken for a rule's effect. q-values correct across all 23 tests</text>
    <text x="20.0" y="892" fill="#6f7a8d" xml:space="preserve">  this run made, but the search reached individual rules by passing</text>
    <text x="20.0" y="912" fill="#6f7a8d" xml:space="preserve">  earlier uncorrected group tests, so read them as nominal.</text>
  </g>
  <text x="20" y="972" fill="#6f7a8d" font-size="11" font-style="italic">Illustrative output. The layout is generated by the real reporter; the numbers are not from a real run.</text>
</svg>
